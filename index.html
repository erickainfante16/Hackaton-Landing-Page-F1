<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merch F1</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>

  </header>

  <main>
 <!--Hero section-->
    <section id="hero" class="w-100 p-0 m-0 overflow-hidden">
      
      <!--Encabezado principal (Blanco) -->
      <div class="bg-white text-center py-4 px-3">
        <div class="container">
          <h1 class="f1-title display-4 fw-black m-0 text-uppercase">
            MERCH <span class="text-f1-red">F1</span>
          </h1>
          <p class="f1-subtitle fw-bold text-uppercase mt-2 mb-0">
            Tu destino para merchandising exclusivo de Formula 1
          </p>
        </div>
      </div>

      <!--Barra de promoción y CTA-->
      <div class="bg-f1-black text-center py-3 px-3 border-bottom-f1-red">
        <div class="container d-flex flex-column align-items-center justify-content-center">
          <p class="text-white fw-bold text-uppercase promo-text mb-2">
            ¡Regístrate ahora al Club F1 y obtiene un 10% de descuento en tu primera compra!
          </p>
          <a href="#contacto" class="btn btn-f1-cta rounded-pill text-uppercase fw-bold">
            Regístrate al Club F1
          </a>
        </div>
      </div>

      <!--Banner Kimi Antonelli -->
      <div class="position-relative text-center bg-black hero-banner-wrapper">
        <img 
          src="assets/kimi-antonelli.jpeg" 
          alt="Kimi Antonelli Campeón F1" 
          class="img-fluid w-100 hero-banner-img d-block"
          loading="eager"
        >
        <div class="hero-overlay position-absolute bottom-0 start-0 w-100 d-flex flex-column justify-content-end align-items-center pb-3 px-3">
          <h2 class="text-white fw-bold text-uppercase hero-title-overlay m-0">
            ¡KIMI ANTONELLI GANA!
          </h2>
          <p class="text-white fw-semibold text-uppercase hero-sub-overlay m-0 mt-1">
            ¡TÚ TAMBIÉN PUEDES VESTIRTE COMO LOS CAMPEONES!
          </p>
        </div>
      </div>

    </section>
  </main>

  <!-- Scripts JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
