<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><!--Para los íconos-->
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!--Kevin Kevin Kevin INICIO DE MIS SECCIONES-->
        <!-- ===== INICIO: sección 4 Beneficios (Kevin) ===== -->
    <section id="beneficios" class="beneficios py-5 bg-white text-black">
        <div class="container">
            <h2 class="beneficios__titulo text-center text-uppercase fw-bold mb-4">Beneficios F1</h2>
            <div class="row row-cols-2 row-cols-md-4 g-4 text-center">

                <div class="col">
                    <i class="bi bi-lightning-charge-fill beneficios__icono"></i>
                    <p class="beneficios__texto text-uppercase fw-semibold mt-2">Tu mercancía llega máximo en 3 días</p>
                </div>

                <div class="col">
                    <i class="bi bi-receipt beneficios__icono"></i>
                    <p class="beneficios__texto text-uppercase fw-semibold mt-2">No pagas impuestos ni nada adicional</p>
                </div>

                <div class="col">
                    <i class="bi bi-patch-check-fill beneficios__icono"></i>
                    <p class="beneficios__texto text-uppercase fw-semibold mt-2">Merch original y exclusivo</p>
                </div>

                <div class="col">
                    <i class="bi bi-people-fill beneficios__icono"></i>
                    <p class="beneficios__texto text-uppercase fw-semibold mt-2">Productos para toda la familia</p>
                </div>

            </div>
        </div>
    </section>
    <!-- ===== FIN: sección 4 Beneficios (Kevin) ===== -->

    <!-- ===== INICIO: anuncio Envío gratis (Kevin) ===== -->
    <aside id="anuncio-envio" class="anuncio bg-black text-white py-3">
    <div class="container">
        <p class="anuncio__texto text-center text-uppercase fw-bold mb-0 d-flex justify-content-center align-items-center gap-3">
        <i class="bi bi-gift anuncio__icono"></i>
        ¡Envío gratis en compras mayores a $299 MXN!
        <i class="bi bi-gift anuncio__icono"></i>
        </p>
    </div>
    </aside>
    <!-- ===== FIN: anuncio 1 Envío gratis (Kevin) ===== -->



        <!-- ===== INICIO: sección 5 Productos (Kevin) ===== -->
    <section id="productos" class="productos py-5">
    <div class="container">
        <h2 class="productos__titulo text-center text-uppercase fw-bold mb-4">Productos más vendidos</h2>

        <div id="carruselProductos" class="carousel slide">
            <div class="carousel-inner px-5">

                <!-- Slide 1 -->
                <div class="carousel-item active">
                    <div class="row row-cols-2 row-cols-md-4 g-3">
                        <div class="col">
                            <div class="card productos__card h-100 text-center shadow-sm">
                                <img src="imgs/cap.jpg" class="card-img-top" alt="F1 Team Cap">
                                <div class="card-body">
                                    <h3 class="h6 text-uppercase fw-bold">F1 Team Cap</h3>
                                    <p class="mb-2">$139.00</p>
                                    <button class="btn btn-dark w-100 text-uppercase">Añadir al carrito</button>
                                </div>
                            </div>
                        </div>
                        <div class="col">
                            <div class="card productos__card h-100 text-center shadow-sm">
                                <img src="imgs/hoodie.jpg" class="card-img-top" alt="Hoodie">
                                <div class="card-body">
                                    <h3 class="h6 text-uppercase fw-bold">Hoodie</h3>
                                    <p class="mb-2">$199.00</p>
                                    <button class="btn btn-dark w-100 text-uppercase">Añadir al carrito</button>
                                </div>
                            </div>
                        </div>

                        <div class="col">
                            <div class="card productos__card h-100 text-center shadow-sm">
                                <img src="imgs/polo.jpg" class="card-img-top" alt="Team Polo">
                                <div class="card-body">
                                    <h3 class="h6 text-uppercase fw-bold">Team Polo</h3>
                                    <p class="mb-2">$299.00</p>
                                    <button class="btn btn-dark w-100 text-uppercase">Añadir al carrito</button>
                                </div>
                            </div>
                        </div>

                        <div class="col">
                            <div class="card productos__card h-100 text-center shadow-sm">
                                <img src="imgs/carrito.png" class="card-img-top" alt="Model Car">
                                <div class="card-body">
                                    <h3 class="h6 text-uppercase fw-bold">Model Car</h3>
                                    <p class="mb-2">$299.00</p>
                                    <button class="btn btn-dark w-100 text-uppercase">Añadir al carrito</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </section>
    <!-- ===== FIN: sección 5 Productos (Kevin) ===== -->
<!--Kevin Kevin Kevin FINAL DE MIS SECCIONES-->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
